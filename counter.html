<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>visitor counter</title>
<style>
  html, body{
    margin:0;
    background:transparent;
    overflow:hidden;
  }
  body{
    display:flex;
    justify-content:center;
    padding:6px 6px 0;
    font-family:'Courier New',monospace;
  }
  .digits{ display:flex; gap:3px; }
  .d{
    min-width:18px;
    padding:3px 0;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    line-height:1.1;
    color:#2b1f30;
    background:#ffffff;
    border:2px solid #2b1f30;
    border-radius:3px;
  }
</style>
</head>
<body>
  <div class="digits" id="digits" role="img" aria-label="visitor count"></div>

  <script>
    var page = new URLSearchParams(location.search).get('p') || '/';
    var box = document.getElementById('digits');

    function show(text){
      box.innerHTML = '';
      text.split('').forEach(function(ch){
        var s = document.createElement('span');
        s.className = 'd';
        s.textContent = ch;
        box.appendChild(s);
      });
      box.setAttribute('aria-label', 'visitor count ' + text);
    }

    show('000000');

    fetch('https://bones.goatcounter.com/counter/' + encodeURIComponent(page) + '.json')
      .then(function(r){ return r.json(); })
      .then(function(j){
        var n = String(j.count).replace(/[^0-9]/g, '') || '0';
        while(n.length < 6) n = '0' + n;
        show(n);
      })
      .catch(function(){ show('??????'); });
  </script>
</body>
</html>
