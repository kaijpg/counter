<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>visitor counter</title>
<style>
  /* palette matches tbnt.neocities.org */
  html,body{
    margin:0;
    padding:0;
    background:transparent;
  }
  body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:40px;
    font-family:'Courier New',monospace;
  }
  .counter{
    display:inline-flex;
    gap:3px;
    padding:5px 7px;
    background:#fbfcfd;
    border:1px solid #cfd9e1;
    border-radius:8px;
    box-shadow:2px 2px 0 rgba(0,0,0,.05);
  }
  .digit{
    width:18px;
    height:26px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:bold;
    color:#3f6d8c;
    background:linear-gradient(to bottom,#ffffff,#e9f1f7);
    border:1px solid #a9c4d6;
    border-radius:4px;
  }
  .digit.pad{ color:#a9c4d6; }   /* leading zeros are faded */
</style>
</head>
<body>

<div class="counter" id="counter">
  <span class="digit pad">0</span><span class="digit pad">0</span><span class="digit pad">0</span>
  <span class="digit pad">0</span><span class="digit pad">0</span><span class="digit pad">0</span>
</div>

<script>
(function () {
  // ====== SETTINGS ======================================================
  var SITE   = "https://bones.goatcounter.com";
  var DIGITS = 6;   // how many digit boxes to show (pads with 0s)
  // ======================================================================

  // Which page to count comes from the iframe link, e.g. counter.html?p=/art
  // No ?p= at all → shows the whole-site total instead.
  var params = new URLSearchParams(location.search);
  var page   = params.get("p");
  var COUNT_URL = page
    ? SITE + "/counter/" + encodeURI(page) + ".json"
    : SITE + "/counter/TOTAL.json";

  function render(n) {
    var s = String(n);
    var padLen = Math.max(0, DIGITS - s.length);
    var box = document.getElementById("counter");
    box.innerHTML = "";
    for (var i = 0; i < padLen + s.length; i++) {
      var span = document.createElement("span");
      span.className = "digit" + (i < padLen ? " pad" : "");
      span.textContent = i < padLen ? "0" : s.charAt(i - padLen);
      box.appendChild(span);
    }
  }

  fetch(COUNT_URL)
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      // GoatCounter formats big numbers with spaces/commas — strip them.
      var n = parseInt(String(data.count).replace(/[^0-9]/g, ""), 10);
      if (!isNaN(n)) render(n);
    })
    .catch(function () { /* leave the zeros showing */ });
})();
</script>

</body>
</html>
